<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rhythm builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    /* Bravura: the SMuFL standard music font, self-hosted so noteheads, rests
       and flags render identically on every device. font-display:block briefly
       waits rather than flashing a mispositioned fallback glyph.
       See fonts/OFL.txt. */
    @font-face {
      font-family: 'Bravura';
      src: url('fonts/Bravura.woff2') format('woff2');
      font-display: block;
    }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "Cormorant Garamond", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2.5rem 1rem 4rem;
      box-sizing: border-box;
    }
    a { color: #9cd8ff; }
    .back {
      position: fixed;
      top: 1rem;
      left: 1rem;
      font-size: 1rem;
      color: #666;
      text-decoration: none;
    }
    .back:hover { color: #d8d8ff; }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }
    .hint {
      margin: -0.5rem 0 0;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.5);
      font-style: italic;
      text-align: center;
      max-width: 34rem;
    }

    /* --- which rhythm --- */
    .pick {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: -0.6rem;
    }
    #rhythm {
      background: #000;
      border: 1px solid #666;
      color: #ddd;
      font-family: inherit;
      font-size: 1.15rem;
      padding: 0.3em 0.5em;
    }
    #rhythm:hover { border-color: #9cd8ff; }
    #range-label {
      margin: 0;
      font-size: 0.9rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.4);
    }

    /* --- the engraving --- */
    /* Drawn in the page's own ink rather than on paper: every note is a live
       element here, and the one sounding lights up as it passes. */
    #score {
      width: min(38rem, 100%);
      padding: 0.6rem 0.2rem;
    }
    #score svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }
    #score .staff { stroke: rgba(255, 255, 255, 0.28); stroke-width: 1.3; }
    #score .barline { stroke: rgba(255, 255, 255, 0.45); stroke-width: 1.6; }
    #score .barline-thick { fill: rgba(255, 255, 255, 0.45); }
    #score .gl { font-family: 'Bravura'; fill: #ececec; }
    #score .sig { font-family: 'Bravura'; fill: rgba(255, 255, 255, 0.75); }
    #score .stem { stroke: #ececec; stroke-width: 1.3; }
    #score .beam { fill: #ececec; }
    #score .tuplet { stroke: rgba(255, 255, 255, 0.6); stroke-width: 1.2; fill: none; }
    #score .tuplet-no { font-family: 'Bravura'; fill: rgba(255, 255, 255, 0.7); font-size: 0.62em; }
    #score .bar-no {
      font-family: "Cormorant Garamond", serif;
      font-size: 0.42em;
      fill: rgba(255, 255, 255, 0.35);
    }
    /* A rest is a length you count, so it is drawn a little back from the
       notes without disappearing — and it lights up on its turn like they do. */
    #score .ev.rest .gl { fill: rgba(255, 255, 255, 0.5); }
    #score .ev.on .gl,
    #score .ev.on .beam { fill: #9cd8ff; }
    #score .ev.on .stem { stroke: #9cd8ff; }
    #score .ev.on .gl { filter: drop-shadow(0 0 6px rgba(156, 216, 255, 0.55)); }

    /* --- the count: which bar, which beat --- */
    #counter {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    #counter.running { opacity: 1; }
    #count-bar {
      font-size: 3.2rem;
      line-height: 1;
      letter-spacing: 0.04em;
      color: #9cd8ff;
      font-variant-numeric: tabular-nums;
    }
    #count-beats { display: flex; gap: 0.5rem; }
    #count-beats .pip {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: background 0.08s, border-color 0.08s;
    }
    #count-beats .pip.on { background: #9cd8ff; border-color: #9cd8ff; }

    /* --- the speed --- */
    .speed {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      width: min(30rem, 100%);
    }
    .speed-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      padding-left: 0.2rem;   /* the note glyph overhangs its box a little */
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      background: #333;
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 1px #000, 0 0 8px rgba(156, 216, 255, 0.7);
    }
    input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 1px #000, 0 0 8px rgba(156, 216, 255, 0.7);
    }
    /* The quarter-note glyph is Bravura (SMuFL), not the Unicode ♩ a phone
       may or may not have — and whose advance width leaves a hole in the line. */
    .mus { font-family: 'Bravura'; font-size: 1.25em; line-height: 1; vertical-align: -0.12em; padding: 0 0.12em; }
    #tempo-pct {
      font-size: 0.9rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.4);
    }

    /* --- controls --- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.7rem 1.4rem;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.6);
      max-width: min(38rem, 100%);
    }
    .ctl { display: inline-flex; align-items: center; gap: 0.5em; }
    .ctl input[type="number"] {
      background: #000;
      border: 1px solid #666;
      color: #ddd;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.2em 0.35em;
      width: 3.6em;
    }
    .ctl input[type="number"]:hover { border-color: #9cd8ff; }
    .ctl select {
      background: #000;
      border: 1px solid #666;
      color: #ddd;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.2em 0.3em;
    }
    .ctl select:hover { border-color: #9cd8ff; }
    .ctl select:disabled, button:disabled {
      opacity: 0.35;
      cursor: default;
      border-color: #444;
    }
    .ctl .dash { color: rgba(255, 255, 255, 0.35); }

    button {
      background: none;
      border: 1px solid #666;
      color: #ddd;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.35em 0.7em;
      cursor: pointer;
    }
    button:hover { border-color: #9cd8ff; color: #fff; }
    button:disabled:hover { border-color: #444; color: #ddd; }
    #play {
      font-size: 1.3rem;
      padding: 0.4em 1.6em;
      letter-spacing: 0.05em;
    }
    #play.playing { border-color: #9cd8ff; color: #9cd8ff; background: rgba(156, 216, 255, 0.12); }
    #whole, #full-speed { font-size: 0.9rem; padding: 0.25em 0.55em; }
    #whole.on { border-color: #9cd8ff; color: #9cd8ff; background: rgba(156, 216, 255, 0.12); }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 0.45em;
      cursor: pointer;
      user-select: none;
    }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch .track {
      width: 2.4em;
      height: 1.2em;
      border: 1px solid #666;
      border-radius: 1em;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
    }
    .switch .thumb {
      position: absolute;
      top: 50%;
      left: 0.15em;
      width: 0.9em;
      height: 0.9em;
      transform: translateY(-50%);
      background: #ddd;
      border-radius: 50%;
      transition: left 0.15s, background 0.15s;
    }
    .switch input:checked + .track { background: #24506b; border-color: #9cd8ff; }
    .switch input:checked + .track .thumb { left: calc(100% - 1.05em); background: #9cd8ff; }

    /* Shown only when the page's scripts didn't run, or the rhythm data
       doesn't add up — either way a page that looks fine and does nothing. */
    #load-error {
      margin: 0;
      padding: 0.8rem 1rem;
      max-width: min(34rem, 100%);
      border: 1px solid rgba(232, 122, 122, 0.5);
      color: #e8a0a0;
      font-size: 1rem;
      text-align: center;
      line-height: 1.5;
    }
    #load-error a { color: #ffb066; }
    #load-error .detail {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: rgba(232, 160, 160, 0.7);
      font-family: ui-monospace, monospace;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>

  <h1>rhythm builder</h1>
  <p class="hint">
    one rhythm, built a measure at a time — loop it, and take the speed down
    to whatever the hands can hold before winding it back up to the mark.
    <br>space starts and stops.
  </p>

  <p id="load-error" hidden>
    this page didn't finish loading — its scripts never ran.
    <a id="load-error-reload" href="">reload</a> to fetch a fresh copy.
    <span class="detail" id="load-error-detail"></span>
  </p>

  <div class="pick">
    <select id="rhythm" aria-label="rhythm"></select>
    <p id="range-label"></p>
  </div>

  <div id="score"></div>

  <div id="counter">
    <span id="count-bar">–</span>
    <span id="count-beats"></span>
  </div>

  <button id="play" type="button">play</button>

  <div class="speed">
    <div class="speed-row">
      <label class="ctl" for="tempo"><span class="mus">&#xE1D5;</span> =</label>
      <input id="speed" type="range" min="30" max="240" step="1" value="96" aria-label="speed">
      <input id="tempo" type="number" min="30" max="240" step="1" value="96" aria-label="tempo">
      <button id="full-speed" type="button">mark</button>
    </div>
    <span id="tempo-pct"></span>
  </div>

  <div class="controls">
    <span class="ctl">
      measures
      <select id="from" aria-label="first measure"></select>
      <span class="dash">–</span>
      <select id="to" aria-label="last measure"></select>
      <button id="whole" type="button">all</button>
    </span>
    <label class="switch">
      <input id="metronome" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
      metronome
    </label>
    <label class="switch">
      <input id="count-in" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
      count-in
    </label>
    <label class="switch">
      <input id="loop" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
      loop
    </label>
  </div>

  <script>
    // Watch the scripts below. A phone has no console, so a script that fails
    // to fetch (flaky connection, a stale or negative cache entry) leaves a
    // page that looks fine and does nothing, with no way to tell why. Listen in
    // the capture phase — resource load failures don't bubble — and report on
    // the page if rhythm.js never reached its last line.
    window.__rhythmProblems = [];
    addEventListener('error', (e) => {
      const src = e.target && e.target.src;
      window.__rhythmProblems.push(src ? 'could not load ' + src.split('/').pop() : (e.message || 'script error'));
    }, true);
    addEventListener('load', () => {
      if (window.__rhythmReady) return;
      const box = document.getElementById('load-error');
      const detail = document.getElementById('load-error-detail');
      const again = document.getElementById('load-error-reload');
      // A unique query is the one reload a cache can't answer from its own copy.
      if (again) again.href = location.pathname + '?r=' + Date.now();
      if (detail) detail.textContent = window.__rhythmProblems.join('; ');
      if (box) box.hidden = false;
    });
  </script>

  <!-- Versioned so a cached script can never pair with newer markup: bump ?v=
       whenever either file changes in a way the other depends on. audio.js is
       at v=5 here because the rhythm note (AudioKit.hit) is newer than the
       copy the measure-practice pages pinned. -->
  <script src="audio.js?v=5"></script>
  <script src="rhythm.js?v=1"></script>
</body>
</html>
