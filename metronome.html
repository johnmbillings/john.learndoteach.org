<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>metronome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #9cd8ff;
      --accent-dim: #2f6f8f;
      --line: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(120% 90% at 50% -10%, #10151c 0%, #05070a 55%, #000 100%);
      color: #fff;
      font-family: "Cormorant Garamond", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      padding: 2.5rem 1rem 4rem;
    }
    a { color: var(--accent); }
    .back {
      position: fixed;
      top: 1rem;
      left: 1rem;
      font-size: 1rem;
      color: #666;
      text-decoration: none;
      z-index: 10;
    }
    .back:hover { color: #d8d8ff; }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }
    .hint {
      margin: -0.6rem 0 0;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.45);
      font-style: italic;
      text-align: center;
      max-width: 30rem;
    }

    /* ---- the metronome body ---- */
    .stage {
      position: relative;
      width: 300px;
      height: 360px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.6));
    }
    .metronome-svg { width: 100%; height: 100%; overflow: visible; }

    .arm {
      transform-box: fill-box;
      transform-origin: 150px 330px;
    }

    /* beat dots */
    .beats {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      min-height: 1.4rem;
    }
    .beat-dot {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      border: 1px solid var(--accent-dim);
      background: transparent;
      transition: transform 0.08s ease, background 0.08s ease, box-shadow 0.08s ease;
    }
    .beat-dot.on {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      transform: scale(1.25);
    }
    .beat-dot.accent { border-color: var(--accent); }
    .beat-dot.accent.on {
      background: #fff;
      box-shadow: 0 0 16px #fff;
    }

    /* ---- readout ---- */
    .readout {
      text-align: center;
      line-height: 1;
      user-select: none;
    }
    .bpm {
      font-size: 5rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    .bpm small { font-size: 1.2rem; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; }
    .marking {
      margin-top: 0.15rem;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: 0.04em;
      min-height: 1.4em;
    }

    /* ---- tempo controls ---- */
    .tempo-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: min(30rem, 100%);
    }
    .step {
      background: none;
      border: 1px solid #555;
      color: #ddd;
      font-family: inherit;
      font-size: 1.6rem;
      line-height: 1;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      cursor: pointer;
      flex: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .step:hover { border-color: var(--accent); color: #fff; }
    .step:active { background: rgba(156, 216, 255, 0.15); }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 40%), #333 var(--fill, 40%), #333 100%);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 1px #000, 0 0 10px rgba(156, 216, 255, 0.7);
    }
    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 1px #000, 0 0 10px rgba(156, 216, 255, 0.7);
    }

    /* ---- start / tap ---- */
    .actions { display: flex; align-items: center; gap: 1rem; }
    .play {
      width: 4.6rem;
      height: 4.6rem;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: rgba(156, 216, 255, 0.08);
      color: var(--accent);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .play:hover { background: rgba(156, 216, 255, 0.18); box-shadow: 0 0 24px rgba(156, 216, 255, 0.35); }
    .play:active { transform: scale(0.96); }
    .play svg { width: 1.9rem; height: 1.9rem; fill: currentColor; }
    .play.playing { color: #fff; border-color: #fff; box-shadow: 0 0 26px rgba(255,255,255,0.3); }

    .tap {
      background: none;
      border: 1px solid #555;
      color: #ddd;
      font-family: inherit;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      padding: 0.55em 1.2em;
      border-radius: 2rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      text-transform: lowercase;
    }
    .tap:hover { border-color: var(--accent); color: #fff; }
    .tap.flash { border-color: var(--accent); color: var(--accent); }

    /* ---- lower controls ---- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.9rem 1.6rem;
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.6);
    }
    .ctl { display: inline-flex; align-items: center; gap: 0.55em; }
    .ctl select {
      background: #000;
      border: 1px solid #555;
      color: #ddd;
      font-family: inherit;
      font-size: 0.98rem;
      padding: 0.25em 0.4em;
      border-radius: 3px;
    }
    .ctl select:hover { border-color: var(--accent); }

    .switch { display: inline-flex; align-items: center; gap: 0.5em; cursor: pointer; user-select: none; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch .track {
      width: 2.4em; height: 1.2em;
      border: 1px solid #555; border-radius: 1em;
      position: relative; transition: background 0.15s, border-color 0.15s;
    }
    .switch .thumb {
      position: absolute; top: 50%; left: 0.15em;
      width: 0.9em; height: 0.9em; transform: translateY(-50%);
      background: #ddd; border-radius: 50%;
      transition: left 0.15s, background 0.15s;
    }
    .switch input:checked + .track { background: var(--accent-dim); border-color: var(--accent); }
    .switch input:checked + .track .thumb { left: calc(100% - 1.05em); background: var(--accent); }

    /* ---- drone: root + 5th under the click ---- */
    .drone {
      width: min(34rem, 100%);
      margin-top: 0.4rem;
      padding: 1rem 1.1rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.025);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    .drone-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem 1.4rem;
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.6);
      width: 100%;
    }
    .drone-btn {
      background: none;
      border: 1px solid #555;
      color: #ddd;
      font-family: inherit;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      padding: 0.5em 1.2em;
      border-radius: 2rem;
      cursor: pointer;
      text-transform: lowercase;
      min-width: 7.5em;
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .drone-btn:hover { border-color: var(--accent); color: #fff; }
    .drone-btn.on {
      border-color: #e0a06a;
      color: #f6c79b;
      box-shadow: 0 0 18px rgba(224, 160, 106, 0.35);
    }
    .drone-vol { display: inline-flex; align-items: center; gap: 0.55em; }
    .drone-vol input[type=range] { width: 6.5rem; flex: none; }

    /* the tonal-center wheel: a horizontal roll bar that snaps to one note */
    .wheel-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .wheel-arrow {
      background: none;
      border: none;
      color: #666;
      font-family: inherit;
      font-size: 1.5rem;
      line-height: 1;
      width: 1.8rem;
      height: 2.4rem;
      cursor: pointer;
      flex: none;
      padding: 0;
    }
    .wheel-arrow:hover { color: var(--accent); }
    .wheel {
      --item: 3.6rem;
      position: relative;
      flex: 1;
      min-width: 0;
      height: 3.6rem;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x;
      outline: none;
      /* fade the ends so it reads as a cylinder seen edge-on */
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
    }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel.dragging { scroll-snap-type: none; cursor: grabbing; scroll-behavior: auto; }
    .wheel:focus-visible .wheel-note.sel { text-shadow: 0 0 18px var(--accent), 0 0 2px #fff; }
    .wheel-track {
      display: flex;
      height: 100%;
      align-items: center;
      padding: 0 calc(50% - var(--item) / 2);
      width: max-content;
    }
    .wheel-note {
      flex: none;
      width: var(--item);
      height: 100%;
      display: grid;
      place-items: center;
      scroll-snap-align: center;
      font-size: 1.45rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      transition: color 0.15s, transform 0.15s, text-shadow 0.15s;
      transform: scale(0.82);
      cursor: pointer;
    }
    .wheel-note.sel {
      color: #fff;
      transform: scale(1.1);
      font-weight: 500;
      text-shadow: 0 0 14px rgba(156, 216, 255, 0.6);
    }
    .wheel-note.near { color: rgba(255, 255, 255, 0.6); transform: scale(0.92); }
    /* centre marks above and below the selected note */
    .wheel-wrap::before, .wheel-wrap::after {
      content: '';
      position: absolute;
      left: 50%;
      width: 0.42rem;
      height: 0.42rem;
      transform: translateX(-50%) rotate(45deg);
      background: var(--accent);
      opacity: 0.7;
      pointer-events: none;
    }
    .wheel-wrap::before { top: 0.05rem; }
    .wheel-wrap::after { bottom: 0.05rem; }
    .drone-now {
      font-style: italic;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.5);
      min-height: 1.2em;
      letter-spacing: 0.03em;
    }
    .drone.on .drone-now { color: #f6c79b; }

    @media (max-width: 420px) {
      .stage { width: 250px; height: 300px; }
      .bpm { font-size: 4rem; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back</a>

  <h1>metronome</h1>
  <p class="hint">a swinging arm, ticking true &mdash; drag the tempo, tap it out, or nudge with &plusmn;<br>space toggles start/stop &middot; &uarr;&darr; change tempo &middot; d toggles the drone</p>

  <div class="stage">
    <svg class="metronome-svg" viewBox="0 0 300 360" aria-hidden="true">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#20272f"/>
          <stop offset="0.5" stop-color="#141920"/>
          <stop offset="1" stop-color="#080b0f"/>
        </linearGradient>
        <linearGradient id="bodyEdge" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
          <stop offset="0.5" stop-color="rgba(255,255,255,0)"/>
          <stop offset="1" stop-color="rgba(0,0,0,0.35)"/>
        </linearGradient>
        <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000"/>
          <stop offset="1" stop-color="#0c1116"/>
        </linearGradient>
        <radialGradient id="tip" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.35" stop-color="#9cd8ff"/>
          <stop offset="1" stop-color="#2f6f8f"/>
        </radialGradient>
        <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#6b7885"/>
          <stop offset="0.5" stop-color="#c8d4de"/>
          <stop offset="1" stop-color="#6b7885"/>
        </linearGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- pyramid body -->
      <path d="M90 60 L210 60 L280 340 L20 340 Z" fill="url(#body)" stroke="#000" stroke-width="1"/>
      <path d="M90 60 L210 60 L280 340 L20 340 Z" fill="url(#bodyEdge)"/>
      <!-- top cap -->
      <rect x="88" y="52" width="124" height="12" rx="3" fill="#252d36" stroke="#000"/>
      <!-- central slot the arm rides in -->
      <path d="M144 74 L156 74 L162 330 L138 330 Z" fill="url(#slot)" stroke="rgba(0,0,0,0.6)"/>
      <!-- tempo scale ticks -->
      <g stroke="rgba(156,216,255,0.35)" stroke-width="1.4" id="scale-ticks"></g>

      <!-- swinging arm (pivot at bottom, 150,330) -->
      <g class="arm" id="arm">
        <line x1="150" y1="330" x2="150" y2="96" stroke="url(#arm)" stroke-width="5" stroke-linecap="round"/>
        <!-- sliding weight (bob) -->
        <g id="bob">
          <rect x="138" y="150" width="24" height="30" rx="3" fill="#2b333c" stroke="#0a0d10"/>
          <rect x="140" y="153" width="20" height="4" rx="2" fill="rgba(255,255,255,0.18)"/>
        </g>
        <!-- glowing tip -->
        <circle cx="150" cy="96" r="9" fill="url(#tip)" filter="url(#glow)"/>
      </g>

      <!-- pivot hub -->
      <circle cx="150" cy="330" r="9" fill="#1a2027" stroke="#000"/>
      <circle cx="150" cy="330" r="3" fill="#3a4550"/>
    </svg>
  </div>

  <div class="beats" id="beats"></div>

  <div class="readout">
    <div class="bpm"><span id="bpm-val">96</span> <small>bpm</small></div>
    <div class="marking" id="marking">andante</div>
  </div>

  <div class="tempo-row">
    <button class="step" id="minus" type="button" aria-label="slower">&minus;</button>
    <input id="slider" type="range" min="30" max="260" value="96" step="1" aria-label="tempo">
    <button class="step" id="plus" type="button" aria-label="faster">+</button>
  </div>

  <div class="actions">
    <button class="play" id="play" type="button" aria-label="start">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="tap" id="tap" type="button">tap tempo</button>
  </div>

  <div class="controls">
    <label class="ctl">
      time
      <select id="meter">
        <option value="1">1</option>
        <option value="2">2 / 4</option>
        <option value="3">3 / 4</option>
        <option value="4" selected>4 / 4</option>
        <option value="5">5 / 4</option>
        <option value="6">6 / 8</option>
        <option value="7">7 / 8</option>
      </select>
    </label>
    <label class="ctl">
      subdivide
      <select id="subdiv">
        <option value="1" selected>none</option>
        <option value="2">eighths</option>
        <option value="3">triplets</option>
        <option value="4">sixteenths</option>
      </select>
    </label>
    <label class="ctl">
      sound
      <select id="sound">
        <option value="wood" selected>woodblock</option>
        <option value="click">click</option>
        <option value="beep">beep</option>
        <option value="tick">soft tick</option>
      </select>
    </label>
    <label class="switch">
      <input id="accent-toggle" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
      accent downbeat
    </label>
  </div>

  <section class="drone" id="drone" aria-label="drone">
    <div class="wheel-wrap">
      <button class="wheel-arrow" id="wheel-prev" type="button" aria-label="lower tonal center">&lsaquo;</button>
      <div class="wheel" id="wheel" tabindex="0" role="slider" aria-label="tonal center"
           aria-valuemin="0" aria-valuemax="11" aria-valuenow="9" aria-valuetext="A">
        <div class="wheel-track" id="wheel-track"></div>
      </div>
      <button class="wheel-arrow" id="wheel-next" type="button" aria-label="higher tonal center">&rsaquo;</button>
    </div>
    <div class="drone-now" id="drone-now"></div>
    <div class="drone-row">
      <button class="drone-btn" id="drone-btn" type="button">drone</button>
      <label class="switch">
        <input id="drone-fifth" type="checkbox" checked>
        <span class="track"><span class="thumb"></span></span>
        add 5th
      </label>
      <label class="ctl">
        octave
        <select id="drone-octave">
          <option value="2">low</option>
          <option value="3" selected>mid</option>
          <option value="4">high</option>
        </select>
      </label>
      <label class="drone-vol">
        vol
        <input id="drone-volume" type="range" min="0" max="0.5" step="0.01" value="0.14" aria-label="drone volume">
      </label>
    </div>
  </section>

  <script src="audio.js"></script>
  <script>
  (() => {
    'use strict';

    // ---------- state ----------
    let bpm = 96;
    const MIN = 30, MAX = 260;
    let beatsPerBar = 4;
    let accentOn = true;
    let sound = 'wood';
    let subdiv = 1;   // ticks per beat: 1 quarter, 2 eighths, 3 triplets, 4 sixteenths
    let playing = false;

    // ---------- audio (lookahead scheduler — "A Tale of Two Clocks") ----------
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null;
    let masterGain = null;       // one boost stage so every tick reads louder
    const VOLUME = 1.7;          // overall loudness (>1 = boost over the raw ticks)
    const LOOKAHEAD = 0.1;       // seconds of audio scheduled ahead
    const TICK_MS = 25;          // scheduler wake interval
    let nextNoteTime = 0;        // ctx time of the next beat
    let beatInBar = 0;           // 0-indexed beat within the current bar
    let schedulerTimer = null;

    // A queue of {beat, time} so the visual layer can flash dots exactly on time.
    const scheduled = [];

    function ensureCtx() {
      if (!ctx) {
        ctx = new AC();
        masterGain = ctx.createGain();
        masterGain.gain.value = VOLUME;
        masterGain.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    // Percussive click synth. Each sound is a short enveloped burst. `level`
    // picks one of three voices: 'accent' (the bright, loud downbeat), 'beat'
    // (a normal main beat), and 'sub' (a subdivision tick — softer and pitched
    // up so the offbeats sit under the beats instead of competing with them).
    function playTick(time, level) {
      const c = ctx;
      const accent = level === 'accent';
      const sub = level === 'sub';
      const lvl = sub ? 0.5 : 1;      // subdivisions are quieter than the beat
      const fMul = sub ? 1.18 : 1;    // ...and a touch higher, so they read as offbeats
      const gain = c.createGain();
      gain.connect(masterGain);

      if (sound === 'beep') {
        const osc = c.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = (accent ? 1320 : 880) * fMul;
        osc.connect(gain);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime((accent ? 0.5 : 0.34) * lvl, time + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.09);
        osc.start(time); osc.stop(time + 0.1);
        return;
      }

      if (sound === 'wood') {
        // woodblock: triangle body + a filtered-noise transient
        const osc = c.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime((accent ? 1750 : 1300) * fMul, time);
        osc.frequency.exponentialRampToValueAtTime((accent ? 900 : 700) * fMul, time + 0.02);
        osc.connect(gain);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime((accent ? 0.6 : 0.42) * lvl, time + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.055);
        osc.start(time); osc.stop(time + 0.06);

        const noise = burst(c, 0.03);
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = (accent ? 2600 : 2000) * fMul; bp.Q.value = 1.2;
        const ng = c.createGain();
        ng.gain.setValueAtTime((accent ? 0.35 : 0.22) * lvl, time);
        ng.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
        noise.connect(bp).connect(ng).connect(masterGain);
        noise.start(time); noise.stop(time + 0.03);
        return;
      }

      if (sound === 'tick') {
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = (accent ? 4200 : 3000) * fMul; bp.Q.value = 0.8;
        const noise = burst(c, 0.02);
        gain.gain.setValueAtTime((accent ? 0.3 : 0.18) * lvl, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.022);
        noise.connect(bp).connect(gain);
        noise.start(time); noise.stop(time + 0.025);
        return;
      }

      // 'click' — crisp square burst (classic digital metronome)
      const osc = c.createOscillator();
      osc.type = 'square';
      osc.frequency.value = (accent ? 2000 : 1500) * fMul;
      osc.connect(gain);
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime((accent ? 0.34 : 0.22) * lvl, time + 0.001);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);
      osc.start(time); osc.stop(time + 0.04);
    }

    // Short white-noise buffer source.
    function burst(c, dur) {
      const len = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource();
      src.buffer = buf;
      return src;
    }

    function secondsPerBeat() { return 60 / bpm; }

    function scheduler() {
      while (nextNoteTime < ctx.currentTime + LOOKAHEAD) {
        const accent = accentOn && beatsPerBar > 1 && beatInBar === 0;
        const spb = secondsPerBeat();
        playTick(nextNoteTime, accent ? 'accent' : 'beat');
        scheduled.push({ beat: beatInBar, time: nextNoteTime, accent });
        // Fill the beat with subdivision ticks (eighths/triplets/sixteenths).
        for (let s = 1; s < subdiv; s++) {
          playTick(nextNoteTime + spb * s / subdiv, 'sub');
        }
        nextNoteTime += spb;
        beatInBar = (beatInBar + 1) % beatsPerBar;
      }
    }

    // ---------- transport ----------
    function start() {
      ensureCtx();
      playing = true;
      beatInBar = 0;
      nextNoteTime = ctx.currentTime + 0.08;
      barZeroTime = nextNoteTime;     // arm reaches an extreme on beat 0
      scheduled.length = 0;
      schedulerTimer = setInterval(scheduler, TICK_MS);
      playBtn.classList.add('playing');
      playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      requestAnimationFrame(animate);
    }

    function stop() {
      playing = false;
      clearInterval(schedulerTimer);
      schedulerTimer = null;
      scheduled.length = 0;
      playBtn.classList.remove('playing');
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      resetArm();
      clearDots();
    }

    function toggle() { playing ? stop() : start(); }

    // ---------- pendulum animation (locked to the audio clock) ----------
    // The arm reaches full deflection exactly on each beat and sweeps through
    // centre at max speed mid-beat. Over two beats it completes one full swing,
    // so ticks land at both extremes — just like a mechanical metronome.
    const AMPLITUDE = 30; // degrees
    let barZeroTime = 0;

    function animate() {
      if (!playing) return;
      const t = ctx.currentTime;
      const beatPos = (t - barZeroTime) / secondsPerBeat(); // beats since start
      const angle = AMPLITUDE * Math.cos(Math.PI * beatPos);
      armEl.style.transform = 'rotate(' + angle + 'deg)';

      // flash beat dots as their scheduled time passes
      while (scheduled.length && scheduled[0].time <= t) {
        const ev = scheduled.shift();
        flashDot(ev.beat, ev.accent);
      }
      requestAnimationFrame(animate);
    }

    function resetArm() { armEl.style.transform = 'rotate(0deg)'; }

    // ---------- beat dots ----------
    const beatsEl = document.getElementById('beats');
    let dots = [];
    function buildDots() {
      beatsEl.innerHTML = '';
      dots = [];
      for (let i = 0; i < beatsPerBar; i++) {
        const d = document.createElement('span');
        d.className = 'beat-dot' + (i === 0 && accentOn && beatsPerBar > 1 ? ' accent' : '');
        beatsEl.appendChild(d);
        dots.push(d);
      }
    }
    let dotTimers = [];
    function flashDot(i, accent) {
      const d = dots[i];
      if (!d) return;
      d.classList.add('on');
      clearTimeout(dotTimers[i]);
      dotTimers[i] = setTimeout(() => d.classList.remove('on'), Math.min(140, secondsPerBeat() * 1000 * 0.5));
    }
    function clearDots() { dots.forEach(d => d.classList.remove('on')); }

    // ---------- tempo & bob position ----------
    // On a real metronome the bob slides UP the arm for slower tempos. Map bpm
    // to a vertical position along the arm so the visual tempo reads at a glance.
    const bobEl = document.getElementById('bob');
    const MARKINGS = [
      [40, 'grave'], [48, 'largo'], [56, 'larghetto'], [66, 'adagio'],
      [76, 'andante'], [92, 'andante'], [108, 'moderato'], [120, 'allegretto'],
      [156, 'allegro'], [176, 'vivace'], [200, 'presto'], [999, 'prestissimo'],
    ];
    function markingFor(v) {
      for (const [ceil, name] of MARKINGS) if (v < ceil) return name;
      return 'prestissimo';
    }

    function updateBob() {
      // slower => bob higher on the arm (smaller y). Arm spans ~y=110..300.
      const frac = (bpm - MIN) / (MAX - MIN);          // 0 slow .. 1 fast
      const y = 116 + frac * 150;                        // 116 (slow/top) .. 266 (fast/low)
      bobEl.setAttribute('transform', 'translate(0,' + (y - 165) + ')');
    }

    // ---------- UI wiring ----------
    const bpmVal = document.getElementById('bpm-val');
    const markingEl = document.getElementById('marking');
    const slider = document.getElementById('slider');
    const armEl = document.getElementById('arm');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('play-icon');

    function setBpm(v, fromSlider) {
      bpm = Math.max(MIN, Math.min(MAX, Math.round(v)));
      bpmVal.textContent = bpm;
      markingEl.textContent = markingFor(bpm);
      if (!fromSlider) slider.value = bpm;
      slider.style.setProperty('--fill', ((bpm - MIN) / (MAX - MIN) * 100) + '%');
      updateBob();
    }

    slider.addEventListener('input', e => setBpm(+e.target.value, true));
    document.getElementById('minus').addEventListener('click', () => setBpm(bpm - 1));
    document.getElementById('plus').addEventListener('click', () => setBpm(bpm + 1));
    playBtn.addEventListener('click', toggle);

    document.getElementById('meter').addEventListener('change', e => {
      beatsPerBar = parseInt(e.target.value, 10);
      beatInBar = 0;
      buildDots();
    });
    document.getElementById('sound').addEventListener('change', e => { sound = e.target.value; });
    document.getElementById('subdiv').addEventListener('change', e => { subdiv = parseInt(e.target.value, 10); });
    document.getElementById('accent-toggle').addEventListener('change', e => {
      accentOn = e.target.checked;
      buildDots();
    });

    // ---------- tap tempo ----------
    const tapBtn = document.getElementById('tap');
    let taps = [];
    tapBtn.addEventListener('click', () => {
      const now = performance.now();
      taps = taps.filter(t => now - t < 2500);   // forget stale taps
      taps.push(now);
      tapBtn.classList.add('flash');
      setTimeout(() => tapBtn.classList.remove('flash'), 120);
      if (taps.length >= 2) {
        let sum = 0;
        for (let i = 1; i < taps.length; i++) sum += taps[i] - taps[i - 1];
        const avg = sum / (taps.length - 1);
        setBpm(60000 / avg);
      }
    });

    // ---------- keyboard ----------
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
      if (e.target.id === 'wheel' && e.code !== 'Space' && e.code !== 'KeyD') return;
      if (e.code === 'Space') { e.preventDefault(); toggle(); }
      else if (e.code === 'KeyD' && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); toggleDrone(); }
      else if (e.code === 'ArrowUp' || e.code === 'ArrowRight') { e.preventDefault(); setBpm(bpm + 1); }
      else if (e.code === 'ArrowDown' || e.code === 'ArrowLeft') { e.preventDefault(); setBpm(bpm - 1); }
    });

    // ---------- draw the fixed tempo scale ticks on the body ----------
    (function drawScale() {
      const g = document.getElementById('scale-ticks');
      for (let i = 0; i <= 10; i++) {
        const y = 120 + i * 15;
        const w = i % 5 === 0 ? 14 : 8;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', 168); line.setAttribute('y1', y);
        line.setAttribute('x2', 168 + w); line.setAttribute('y2', y);
        g.appendChild(line);
      }
    })();

    // ---------- drone: root + 5th, with a roll bar for the tonal centre ----------
    // The sustained voice is the shared engine in audio.js (same one the jazz
    // page uses): a sawtooth root through the cello filters, plus a just fifth.
    const NOTES = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
    const FIFTH_OF = ['G', 'A♭', 'A', 'B♭', 'B', 'C', 'D♭', 'D', 'E♭', 'E', 'F', 'F♯'];
    const drone = AudioKit.createDrone();
    let rootPc = 9;        // pitch class 0..11 (A)
    let droneOctave = 3;   // A3 = 220 Hz under the mid setting

    const droneEl = document.getElementById('drone');
    const droneBtn = document.getElementById('drone-btn');
    const droneNow = document.getElementById('drone-now');
    const fifthToggle = document.getElementById('drone-fifth');
    const octaveSel = document.getElementById('drone-octave');
    const droneVol = document.getElementById('drone-volume');
    const wheel = document.getElementById('wheel');
    const track = document.getElementById('wheel-track');
    let noteEls = [];

    function rootMidi() { return rootPc + (droneOctave + 1) * 12; }

    function applyRoot() {
      drone.setRoot(rootMidi());
      wheel.setAttribute('aria-valuenow', rootPc);
      wheel.setAttribute('aria-valuetext', NOTES[rootPc]);
      noteEls.forEach((el, i) => {
        el.classList.toggle('sel', i === rootPc);
        el.classList.toggle('near', Math.abs(i - rootPc) === 1);
      });
      const sub = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'][droneOctave] || droneOctave;
      droneNow.textContent = NOTES[rootPc] + sub + (fifthToggle.checked ? ' + ' + FIFTH_OF[rootPc] : '')
        + (drone.playing ? ' sounding' : '');
    }

    function itemWidth() { return noteEls[0] ? noteEls[0].offsetWidth : 1; }
    function nearestIndex() {
      return Math.max(0, Math.min(NOTES.length - 1, Math.round(wheel.scrollLeft / itemWidth())));
    }
    // Scroll the roll bar so note i sits under the centre marks.
    function scrollToIndex(i, smooth) {
      i = Math.max(0, Math.min(NOTES.length - 1, i));
      wheel.scrollTo({ left: i * itemWidth(), behavior: smooth ? 'smooth' : 'auto' });
    }
    function selectIndex(i, smooth) {
      i = Math.max(0, Math.min(NOTES.length - 1, i));
      if (i !== rootPc) { rootPc = i; applyRoot(); }
      scrollToIndex(i, smooth);
    }

    function buildWheel() {
      track.innerHTML = '';
      noteEls = NOTES.map((n, i) => {
        const el = document.createElement('span');
        el.className = 'wheel-note';
        el.textContent = n;
        el.addEventListener('click', () => { if (!dragMoved) selectIndex(i, true); });
        track.appendChild(el);
        return el;
      });
    }

    // Live retune while the bar rolls: whichever note is nearest the centre is
    // the root, so dragging through the keys glides the drone with it.
    wheel.addEventListener('scroll', () => {
      const i = nearestIndex();
      if (i !== rootPc) { rootPc = i; applyRoot(); }
    }, { passive: true });

    // Mouse wheel / trackpad: one notch moves one note.
    let wheelAccum = 0, wheelLock = 0;
    wheel.addEventListener('wheel', e => {
      e.preventDefault();
      const now = performance.now();
      if (now < wheelLock) return;
      wheelAccum += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (Math.abs(wheelAccum) < 12) return;
      selectIndex(rootPc + (wheelAccum > 0 ? 1 : -1), true);
      wheelAccum = 0;
      wheelLock = now + 140;
    }, { passive: false });

    // Mouse drag-to-roll (touch already scrolls natively). Snap is switched off
    // while dragging and the bar settles on the nearest note at release.
    let dragging = false, dragMoved = false, dragStartX = 0, dragStartScroll = 0;
    wheel.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') return;
      dragging = true; dragMoved = false;
      dragStartX = e.clientX; dragStartScroll = wheel.scrollLeft;
      wheel.classList.add('dragging');
      wheel.setPointerCapture(e.pointerId);
    });
    wheel.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 3) dragMoved = true;
      wheel.scrollLeft = dragStartScroll - dx;
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      wheel.classList.remove('dragging');
      try { wheel.releasePointerCapture(e.pointerId); } catch (err) {}
      if (dragMoved) selectIndex(nearestIndex(), true);
      setTimeout(() => { dragMoved = false; }, 0);
    }
    wheel.addEventListener('pointerup', endDrag);
    wheel.addEventListener('pointercancel', endDrag);

    wheel.addEventListener('keydown', e => {
      if (e.code === 'ArrowRight' || e.code === 'ArrowUp') { e.preventDefault(); selectIndex(rootPc + 1, true); }
      else if (e.code === 'ArrowLeft' || e.code === 'ArrowDown') { e.preventDefault(); selectIndex(rootPc - 1, true); }
      else if (e.code === 'Home') { e.preventDefault(); selectIndex(0, true); }
      else if (e.code === 'End') { e.preventDefault(); selectIndex(NOTES.length - 1, true); }
    });
    document.getElementById('wheel-prev').addEventListener('click', () => selectIndex(rootPc - 1, true));
    document.getElementById('wheel-next').addEventListener('click', () => selectIndex(rootPc + 1, true));

    function toggleDrone() {
      if (drone.playing) {
        drone.stop();
        droneBtn.textContent = 'drone';
        droneBtn.classList.remove('on');
        droneEl.classList.remove('on');
      } else {
        drone.setRoot(rootMidi());
        drone.start();
        droneBtn.textContent = 'stop drone';
        droneBtn.classList.add('on');
        droneEl.classList.add('on');
      }
      applyRoot();
    }
    droneBtn.addEventListener('click', toggleDrone);
    fifthToggle.addEventListener('change', () => { drone.setFifth(fifthToggle.checked); applyRoot(); });
    octaveSel.addEventListener('change', () => { droneOctave = parseInt(octaveSel.value, 10); applyRoot(); });
    droneVol.addEventListener('input', () => drone.setVolume(parseFloat(droneVol.value)));

    function initDrone() {
      buildWheel();
      drone.setFifth(fifthToggle.checked);
      drone.setVolume(parseFloat(droneVol.value));
      droneOctave = parseInt(octaveSel.value, 10);
      applyRoot();
      scrollToIndex(rootPc, false);
      // Re-centre if the layout changes width (rotation, font load).
      window.addEventListener('resize', () => scrollToIndex(rootPc, false));
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => scrollToIndex(rootPc, false));
    }

    // ---------- init ----------
    buildDots();
    setBpm(96);
    initDrone();
  })();
  </script>
</body>
</html>
